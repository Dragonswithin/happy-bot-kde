# GitHub issue form for problems with Happy Bot. It asks for what a fix
# usually needs: what was typed, what happened, the Plasma and distro
# versions, how Happy Bot was installed, which kind of AI answered, and the
# output of `happy-bot doctor` (a short, secret-free health check run by
# src/happy_bot/cli.py). Pasting conversations or settings files is not
# requested, because they can hold whatever the assistant read.
name: Something went wrong
description: Happy Bot did the wrong thing, failed, or would not start.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Happy Bot and taking the time to report this.
        Please leave out API keys, private file contents and anything else you would not post publicly.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you typed or clicked, what Happy Bot did, and what you expected instead.
      placeholder: |
        I typed "turn on night light", it said it was done, but nothing changed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: Steps, if you know them. "It happens every time" or "only once" helps too.
    validations:
      required: false
  - type: input
    id: plasma
    attributes:
      label: Plasma version and distribution
      description: System Settings > About this System shows both.
      placeholder: Plasma 6.5.3 on Fedora 43
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install Happy Bot?
      options:
        - scripts/install.sh
        - Arch package (packaging/arch)
        - Other
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Which kind of AI was answering?
      description: The model's name helps too; put it in the next box if you like.
      options:
        - On this computer (llama.cpp, Ollama, LM Studio, ...)
        - Online service (Claude, OpenAI, Gemini, OpenRouter, ...)
        - Not sure / not set up yet
    validations:
      required: true
  - type: input
    id: model-name
    attributes:
      label: Model name (optional)
      placeholder: qwen3-30b-a3b through Ollama
    validations:
      required: false
  - type: textarea
    id: doctor
    attributes:
      label: Output of `happy-bot doctor`
      description: Run it in a terminal and paste the result. It is a short health check and contains no keys.
      render: text
    validations:
      required: false
